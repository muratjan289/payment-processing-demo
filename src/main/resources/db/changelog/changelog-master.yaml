databaseChangeLog:
  - changeSet:
      id: 001-create-payments-table
      author: murat
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: customer_id
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: numeric(19, 2)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: varchar(3)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: varchar(30)
                  constraints:
                    nullable: false

              - column:
                  name: idempotency_key
                  type: varchar(150)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_payments_idempotency_key

              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-payment-history-table
      author: murat
      changes:
        - createTable:
            tableName: payment_history
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: payment_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: old_status
                  type: varchar(30)

              - column:
                  name: new_status
                  type: varchar(30)
                  constraints:
                    nullable: false

              - column:
                  name: changed_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: payment_history
            baseColumnNames: payment_id
            constraintName: fk_payment_history_payment
            referencedTableName: payments
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 003-create-payment-history-index
      author: murat
      changes:
        - createIndex:
            tableName: payment_history
            indexName: idx_payment_history_payment_id
            columns:
              - column:
                  name: payment_id